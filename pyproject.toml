[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sab"
version = "0.1.0"
description = "StockAgent Backtester: real-data, no-lookahead backtesting of LLM agents vs classical strategies"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# real model providers (M4). Not needed for the mock providers or the tests; `sab.llm` imports them lazily.
llm = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
