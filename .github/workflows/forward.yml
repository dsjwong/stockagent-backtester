name: forward

# Daily forward paper trade: fetch the latest close, decide (anonymised + real) with the pinned model, log, report, commit.
# Needs the repo secret GEMINI_API_KEY (Settings > Secrets and variables > Actions). Without it the job skips with a warning.
on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC, after the US close (20:00 UTC EDT / 21:00 UTC EST) and before the next open
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=forward test skipped::Repository secret GEMINI_API_KEY is not set. Add it under Settings > Secrets and variables > Actions, then re-run. No decision was made."
            echo "### Forward test skipped: secret GEMINI_API_KEY is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.have_key == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.key.outputs.have_key == 'true'
        run: pip install -e '.[dev]'

      - name: Fetch + decide
        if: steps.key.outputs.have_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/forward_run.py

      - name: Report
        if: ${{ !cancelled() && steps.key.outputs.have_key == 'true' }}
        run: python scripts/forward_report.py > /dev/null

      - name: Commit and push (before the next open)
        if: ${{ !cancelled() && steps.key.outputs.have_key == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward reports
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "forward: $(date -u +%F) daily run (decisions, bars, report)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
